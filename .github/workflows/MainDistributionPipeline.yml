#
# Builds the extension against DuckDB 1.5 (stable) and 2.x (v2.0-cyanoptera).
# Also runs the standalone policy tests that do not need DuckDB.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Policy tests (no DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run policy tests
        run: make policy-test

  duckdb-stable-build:
    name: Build extension binaries (DuckDB 1.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: lakemon

  duckdb-2-build:
    name: Build extension binaries (DuckDB 2.x)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: lakemon
