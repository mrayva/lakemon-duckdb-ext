#
# Expensive DuckDB 1.5 and 2.x multi-platform extension binaries.
# Does not run on ordinary feature-branch pushes.
#
# Run the full matrix before a community listing submit or merge to main:
#   GitHub → Actions → "Main Extension Distribution Pipeline" → Run workflow
#   (select the branch). Also runs automatically on push to main and v* tags.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (DuckDB 1.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: lakemon

  duckdb-2-build:
    name: Build extension binaries (DuckDB 2.x)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: lakemon
